# ─── AR OpenCL CI Runner Fleet (ROCm) ────────────────────────────────
#
# Launches self-hosted GitHub Actions runners that pick up jobs labelled
# `ar-ci-cl` — the OpenCL lane (`test-cl`, `test-media-cl`).
#
# Deliberately NOT labelled `ar-ci`. The existing Linux fleet carries `ar-ci`
# and serves `test` and `test-media`; sharing the label would pull general CPU
# test jobs onto this machine and put the CL lane behind an unrelated queue.
#
# Quick start:
#   cp .env.example .env   # fill in GITHUB_PAT, RENDER_GROUP_ID
#   docker compose up -d --build
#
# Start with ONE runner. This host has a single GPU; concurrent jobs contend for
# it, which is the exact problem the macOS GPU lane's serialisation exists to
# avoid. Scale only once contention has been measured.
#
# See README.md for full documentation.
# ─────────────────────────────────────────────────────────────────────

# Explicit project name so this stack cannot collide with another runner fleet
# whose compose file also lives in a directory named for its platform.
name: ar-ci-cl

services:
  runner:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ROCM_OPENCL_LIB: ${ROCM_OPENCL_LIB:-/opt/rocm/lib/opencl/libamdocl64.so}
    environment:
      - GITHUB_PAT=${GITHUB_PAT}
      - GITHUB_OWNER=${GITHUB_OWNER:-almostrealism}
      - GITHUB_REPO=${GITHUB_REPO:-common}
      - RUNNER_SCOPE=${RUNNER_SCOPE:-org}
      - RUNNER_PREFIX=${RUNNER_PREFIX:-amd-halo}
      - RUNNER_GROUP=${RUNNER_GROUP:-Default}
      - RUNNER_LABELS=ar-ci-cl
    devices:
      # The compute (/dev/kfd) and render (/dev/dri) nodes. Passing them through
      # is necessary but not sufficient — see group_add below.
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      # The render devices are root:render on the host, and the POSIX ACL on them
      # grants the *interactive* user, not a group. A service account inherits
      # nothing from that ACL, so the container process must carry the render
      # group explicitly.
      #
      # The correct value depends on the runtime, and the two are not
      # interchangeable:
      #   rootless podman -> "keep-groups". The container runs as the service
      #     account, which already holds the render group on the host, but podman
      #     drops supplementary groups inside the user namespace unless told to
      #     keep them. A numeric gid here would be interpreted INSIDE the user
      #     namespace, where it maps to a subgid and grants nothing.
      #   rootful docker  -> the numeric host gid from `getent group render`.
      #
      # Either way a wrong value surfaces as "no OpenCL platform is visible" in
      # the entrypoint preflight, not as a permission error.
      - ${RENDER_GROUP:?set RENDER_GROUP in .env — see README}
    volumes:
      # The host's ROCm userspace, read-only. The image ships no ROCm and is
      # inert without this; the entrypoint preflight refuses to register.
      - ${ROCM_HOST_PATH:-/opt/rocm}:/opt/rocm:ro
      # The curated audio sample library used by the studio benchmarks in
      # test-media-cl. Mirrors the macOS /Users/Shared/Music layout (a Samples/
      # directory beside pattern-factory.json) so the same sync script can seed
      # it. Without this, tests that call AudioSceneTestBase.requireCuratedLibrary()
      # fail outright on a GPU host — which is intended, but is a failure the
      # migration should not have to discover from CI.
      - ${SAMPLES_HOST_PATH:-/srv/ar-ci/music}:/opt/ar-samples:ro
    deploy:
      resources:
        limits:
          memory: ${RUNNER_MEMORY_LIMIT:-64g}
          cpus: "${RUNNER_CPU_LIMIT:-12}"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
