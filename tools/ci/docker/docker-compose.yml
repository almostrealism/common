# ─── AR CI Runner Fleet ──────────────────────────────────────────────
#
# Launches a fleet of self-hosted GitHub Actions runners that pick up
# jobs labelled `ar-ci` from the Almost Realism pipeline.
#
# Quick start:
#   cp .env.example .env   # fill in GITHUB_PAT, RUNNER_PREFIX
#   docker compose up -d --scale runner=5
#
# Each runner registers as <RUNNER_PREFIX>-1, <RUNNER_PREFIX>-2, etc.
# Set RUNNER_PREFIX per machine (e.g., "mac-studio", "linux-build-1").
#
# See README.md for full documentation.
# ─────────────────────────────────────────────────────────────────────

# Explicit project name — without this, Docker Compose uses the parent
# directory name ("docker"), which collides with any other runner fleet
# whose compose file also lives in a directory named "docker" (e.g.,
# the Mosaic Platform fleet). Sharing a project name between stacks
# causes one `docker compose up` to tear down the other's containers.
name: ar-ci

services:
  runner:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - GITHUB_PAT=${GITHUB_PAT}
      - RUNNER_SCOPE=${RUNNER_SCOPE:-repo}
      - GITHUB_OWNER=${GITHUB_OWNER:-almostrealism}
      - GITHUB_REPO=${GITHUB_REPO:-common}
      - RUNNER_PREFIX=${RUNNER_PREFIX:-ar-runner}
      - RUNNER_LABELS=ar-ci
    volumes:
      # Persistent, shared Maven dependency cache. Every replica on this host
      # mounts it and uses its own <runner> subdirectory (the select-maven-repo
      # action), so the plugin and dependency set resolved once survives the
      # ephemeral containers and is reused instead of re-downloaded from Maven
      # Central on every job — the fix for the Central 429 rate-limit failures.
      # A named volume auto-creates, inherits the image mount point's runner
      # ownership so the non-root runner can write, and persists across container
      # recreation. See "Maven dependency caching" in tools/ci/README.md.
      - ar-maven-cache:/opt/ar-maven-cache
    deploy:
      resources:
        limits:
          memory: ${RUNNER_MEMORY_LIMIT:-16g}
          cpus: "${RUNNER_CPU_LIMIT:-4}"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

volumes:
  # Survives container recreation, so the ephemeral ar-ci runners stay warm.
  # Remove it (`docker volume rm ar-ci_ar-maven-cache`) to force a cold rebuild
  # of the cache; a cold cache resolves correctly, only slower.
  ar-maven-cache:
    driver: local
