# Example SignalWire configuration for FlowTree alert delivery
#
# Alerts are how the controller reaches a person out of band from any chat
# channel: a job outcome worth interrupting someone for, or a note an agent
# sends through the ar-manager send_alert tool. Without this file the alert
# machinery is inert — nothing fails, nothing is delivered.
#
# WHERE THIS FILE GOES
#
# The controller reads "signalwire.properties" from its working directory,
# which is the config directory it was started in. In the Docker deployment
# that is /config, bind-mounted from the host, so the file belongs beside
# workstreams.yaml:
#
#   cp signalwire-example.properties \
#      /Users/Shared/flowtree/controller/signalwire.properties
#   chmod 600 /Users/Shared/flowtree/controller/signalwire.properties
#
# The file is read once, at controller startup. Restart after changing it.
#
# It holds an API token. Keep it out of version control and off any
# world-readable path.

# ---------------------------------------------------------------------------
# Account
# ---------------------------------------------------------------------------

# Your SignalWire space — the subdomain of signalwire.com, without the
# domain. A space named "example" is reached at example.signalwire.com.
sw.space=your-space

# Project ID and API token, from the SignalWire dashboard under
# "API Credentials". The two are sent together as HTTP basic auth.
sw.project=your-project-id
sw.token=your-api-token

# The number messages are sent FROM, in E.164 format. Must be a number
# your SignalWire project owns. For the registered toll-free messaging
# program this is the toll-free number, e.g. +1833XXXXXXX. This key, and
# only this key, controls the sender number — change it here rather than
# anywhere in source.
sw.from_number=+15551234567

# The number that receives LIFECYCLE alerts — the ones the controller
# raises itself, such as a job finishing. Alerts addressed to a named
# person go elsewhere: those recipients are configured under
# alertRecipients in workstreams.yaml and reach their own numbers.
sw.to_number=+15559876543

# ---------------------------------------------------------------------------
# Message format
# ---------------------------------------------------------------------------

# There is nothing to configure here. Every outbound body is framed by the
# registered toll-free messaging program into the exact shape the carriers
# approved: the brand prefix "Almost Realism Media: ", the alert text
# (normalized to GSM-7 and truncated to fit a single segment), and the fixed
# suffix " Reply STOP to unsubscribe, HELP for assistance." Traffic that does
# not match the registered samples is filtered by the carriers, so the format
# is deliberately not operator-tunable.

# ---------------------------------------------------------------------------
# Inbound keyword webhook
# ---------------------------------------------------------------------------

# Point the SignalWire number's inbound "Messages" webhook (HTTP POST) at the
# controller path:
#
#   https://<controller-host>/api/sms/inbound
#
# The controller answers STOP/STOPALL/UNSUBSCRIBE/CANCEL/END/QUIT by recording
# an opt-out, START/UNSTOP/YES by clearing it, and HELP/INFO with program info,
# replying in cXML. Opt-out state is persisted in the controller data directory
# (sms-optout) and suppresses all future sends to that number.
#
# NOTE: inbound request-signature validation is not yet implemented. See the
# TODO in InboundSmsHandler; it needs the exact public URL wired through
# configuration before the endpoint is exposed on the public internet.

# ---------------------------------------------------------------------------
# Optional
# ---------------------------------------------------------------------------

# Rate limit. The ceiling is shared by every recipient, because the
# account is what a carrier blocks when it decides a sender is spamming;
# a per-recipient budget would multiply the account's exposure by the
# number of people configured.
#
# The window slides rather than resetting on a boundary, so a deployment
# that reaches the ceiling recovers as the oldest messages age out.
# Callers going through the alert API additionally get a per-caller
# budget of half this ceiling, so one runaway session cannot spend all
# of it.
#
# Defaults: 30 messages per 60 minutes. Both are ignored unless positive.
#
# alert.max_messages=30
# alert.window_minutes=60
