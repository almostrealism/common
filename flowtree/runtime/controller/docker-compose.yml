# ─── FlowTree Controller Stack ────────────────────────────────────────
#
# Runs the three server-side services that make up the FlowTree
# controller stack:
#
#   flowtree-controller  The Java controller that accepts inbound agent
#                        connections (:7766) and exposes the job
#                        submission HTTP API (:7780).
#
#   ar-memory            Semantic memory store used by agents and the
#                        ar-manager MCP server.
#
#   ar-manager           MCP server that bridges Claude Code agents to
#                        the controller, GitHub, and ar-memory.
#
#   fleet-db             Postgres store for runner-fleet monitoring
#   fleet-grafana        (docs/plans/RUNNER_FLEET_MONITORING.md); both
#                        bound to the tailnet address only — see the
#                        section at the end of this file.
#
# ⚠ TLS REQUIREMENT ⚠
#   Services are exposed over plain HTTP. Bearer tokens and API traffic
#   are NOT encrypted in transit. For any internet-facing deployment,
#   place a TLS-terminating reverse proxy (Tailscale Funnel, Caddy,
#   nginx + certbot) in front of ar-manager.
#
# Quick start — run from the repo root:
#   ./flowtree/runtime/rebuild.sh
#
# Controller configuration:
#   Place workstreams.yaml and notification token files in
#   /Users/Shared/flowtree/controller/ on the host.
#   GitHub org tokens go in the githubOrgs section of workstreams.yaml.
#   See flowtree/runtime/src/main/resources/workstreams-example.yaml for reference.
#
# SMS alerting (optional):
#   Place signalwire.properties in the same directory. The controller
#   resolves it relative to its working directory, which is /config, so
#   it must sit beside workstreams.yaml rather than under /secrets.
#   Absent, alert delivery is inert — no error is raised.
#   See flowtree/runtime/src/main/resources/signalwire-example.properties.
#   Named recipients go in the alertRecipients section of workstreams.yaml;
#   both are read at startup, so restart after changing either.
#
# Manager configuration:
#   Place manager-tokens.json in /Users/Shared/flowtree/manager/ on the host.
#   Generate a token: tools/mcp/manager/generate-token.sh
#
# ─────────────────────────────────────────────────────────────────────

services:
  ar-memory:
    build:
      context: ../../../tools/mcp/memory
      dockerfile: Dockerfile
    ports:
      - "${AR_MEMORY_PORT:-8020}:8020"
    volumes:
      - /Users/Shared/flowtree/memory-data:/data
    environment:
      - AR_MEMORY_DATA_DIR=/data
      - AR_MEMORY_HTTP_PORT=8020
      - AR_MEMORY_AUTH_TOKEN=${AR_MEMORY_AUTH_TOKEN:-}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  flowtree-controller:
    build:
      context: ../../..
      dockerfile: flowtree/runtime/controller/Dockerfile
    ports:
      - "7780:7780"
      - "7766:7766"
    volumes:
      - /Users/Shared/flowtree/controller:/config
      - /Users/Shared/flowtree/secrets:/secrets:ro
    environment:
      - FLOWTREE_PORT=7766
      - AR_MEMORY_URL=http://ar-memory:8020
      - AR_MANAGER_URL=https://mac-studio.taild0f87.ts.net
      - AR_MANAGER_SHARED_SECRET_FILE=/secrets/shared-secret
    depends_on:
      ar-memory:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  ar-tracker:
    build:
      context: ../../../tools/tracker
      dockerfile: Dockerfile
    ports:
      - "${AR_TRACKER_PORT:-8030}:8030"
    volumes:
      - /Users/Shared/flowtree/tracker:/data
    environment:
      - AR_TRACKER_DATA_DIR=/data
      - AR_TRACKER_PORT=8030
      - AR_TRACKER_AUTH_TOKEN=${AR_TRACKER_AUTH_TOKEN:-}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8030/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped

  ar-manager:
    build:
      # Repo root: the image bakes in the documentation corpus, which lives
      # outside tools/mcp. The root .dockerignore keeps the context small.
      context: ../../..
      dockerfile: tools/mcp/manager/Dockerfile
    ports:
      - "${AR_MANAGER_PORT:-8010}:8010"
    volumes:
      - /Users/Shared/flowtree/manager:/config:ro
      - /Users/Shared/flowtree/secrets:/secrets:ro
      # Writable state: OAuth dynamic client registrations persist here so
      # they survive container restarts (a restart otherwise wipes the
      # in-memory registry and breaks every connected MCP client's cached
      # client_id).
      - /Users/Shared/flowtree/manager-state:/state
    environment:
      - AR_CONTROLLER_URL=http://flowtree-controller:7780
      - AR_MEMORY_URL=http://ar-memory:8020
      - AR_MANAGER_TOKEN_FILE=/config/manager-tokens.json
      - AR_MANAGER_OAUTH_STATE_FILE=/state/oauth-clients.json
      - AR_MANAGER_ISSUER_URL=${AR_MANAGER_ISSUER_URL:-}
      - AR_MANAGER_SHARED_SECRET_FILE=/secrets/shared-secret
      - AR_CONSULTANT_BACKEND=${AR_CONSULTANT_BACKEND:-llamacpp}
      - AR_CONSULTANT_LLAMACPP_URL=${AR_CONSULTANT_LLAMACPP_URL:-}
      - AR_TRACKER_URL=http://ar-tracker:8030
      - AR_TRACKER_AUTH_TOKEN=${AR_TRACKER_AUTH_TOKEN:-}
    depends_on:
      flowtree-controller:
        condition: service_started
      ar-memory:
        condition: service_healthy
      ar-tracker:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  # ─── Runner fleet monitoring ───────────────────────────────────────
  #
  # The central store and dashboard for docs/plans/RUNNER_FLEET_MONITORING.md.
  # Collectors on every runner host and the GitHub poller write to fleet-db
  # over the tailnet; Grafana reads it over the compose network.
  #
  # These two differ from the services above in two deliberate ways:
  #
  #   * Their published ports are bound to FLEET_BIND_ADDR — the host's
  #     tailnet address, which rebuild.sh detects — not to every interface.
  #     A database and a dashboard must be unreachable from anything but the
  #     tailnet even if the host firewall is misconfigured. The variable is
  #     required, so a run without it fails here rather than publishing on
  #     0.0.0.0 by default.
  #   * Their credentials come from files under the secrets directory (which
  #     rebuild.sh generates on first run), never from environment variables
  #     with an empty default. A missing file fails the service; it does
  #     not start without a password.
  #
  # Restarts here are independent of the controller and manager, but a full
  # `rebuild.sh` recreates these containers too; both keep their state in
  # the mounted data directories, and the collectors reconnect on their own.
  #
  # The images are pinned through FLEET_DB_IMAGE / FLEET_GRAFANA_IMAGE so an
  # operator can hold a database major version (a Postgres data directory is
  # not forward-compatible across major versions) without editing this file.
  # FLEET_DB_IMAGE's own default pins a major version rather than `latest`,
  # so an unattended redeploy that never set the variable cannot pull a new
  # major against the existing data directory and fail to start.

  fleet-db:
    image: ${FLEET_DB_IMAGE:-postgres:16}
    ports:
      # The port is always 5432: every collector/poller and the README's
      # deployment instructions hardcode it in the store URL they connect
      # with, so an override here (as opposed to FLEET_BIND_ADDR, which
      # every consumer discovers itself) would silently point them at the
      # wrong port with no way to propagate the change.
      - "${FLEET_BIND_ADDR:?set FLEET_BIND_ADDR to the tailnet address (rebuild.sh does)}:5432:5432"
    volumes:
      - /Users/Shared/flowtree/fleet-db:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=fleet
      - POSTGRES_USER=fleet
      - POSTGRES_PASSWORD_FILE=/run/secrets/fleet-db-password
    secrets:
      - fleet-db-password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet -d fleet"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  fleet-grafana:
    image: ${FLEET_GRAFANA_IMAGE:-grafana/grafana:latest}
    ports:
      - "${FLEET_BIND_ADDR:?set FLEET_BIND_ADDR to the tailnet address (rebuild.sh does)}:${FLEET_GRAFANA_PORT:-3000}:3000"
    volumes:
      - /Users/Shared/flowtree/grafana:/var/lib/grafana
      # Datasource and the fleet dashboard are provisioned from the
      # checkout, so a redeploy carries dashboard changes with it.
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD__FILE=/run/secrets/grafana-admin-password
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_SERVER_ROOT_URL=${FLEET_GRAFANA_ROOT_URL:-http://${FLEET_BIND_ADDR}:${FLEET_GRAFANA_PORT:-3000}}
    secrets:
      - fleet-db-password
      - grafana-admin-password
    depends_on:
      fleet-db:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

# Credential files, mounted at /run/secrets/<name>. rebuild.sh generates
# both on first run (mode 600, beside the ar-manager shared secret).
secrets:
  fleet-db-password:
    file: /Users/Shared/flowtree/secrets/fleet-db-password
  grafana-admin-password:
    file: /Users/Shared/flowtree/secrets/grafana-admin-password
