name: "Plan Ready"

# This repository's caller of the reusable Plan Ready workflow
# (plan-ready.yaml). Marking a draft plan PR ready for review is how the owner
# approves it; this turns that transition into a dispatch of the implementation
# workflow on the PR's head branch.
#
# It keeps the trigger, the per-head-branch concurrency group and the
# caller-side permissions, and passes the approver allowlist from this
# repository's PLAN_APPROVERS variable. docs-directory and dispatch-workflow are
# left at the reusable workflow's defaults (docs/ and verify-completion.yaml),
# so behaviour here is identical to before the extraction. All the trust
# properties — no checkout of PR code, the fork guard, event data reaching shell
# only through the environment — live in plan-ready.yaml; see its header.

on:
  pull_request_target:
    types: [ready_for_review]
    branches: [master]

# Serialise per head branch so a rapid draft/ready toggle cannot dispatch twice.
concurrency:
  group: ready-plan-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  dispatch:
    uses: ./.github/workflows/plan-ready.yaml
    permissions:
      actions: write
      pull-requests: read
      contents: read
    with:
      approvers: ${{ vars.PLAN_APPROVERS }}
