name: "Deploy Controller Stack"

# Rebuilds and restarts the FlowTree controller-stack containers on the host
# that runs them.
#
# Why this is a separate workflow_run workflow:
# The deployment is gated on a GitHub Environment. Any job that declares
# `environment:` inside a pull_request run attaches a deployment status to the
# PR head commit; a pending deployment that is later cancelled then surfaces as
# a spurious "had a problem deploying" red X on the PR. This is the same reason
# "Auto-Resolve Submit" was split out — see the comment at the top of
# auto-resolve-submit.yaml. Running from workflow_run puts the deployment in the
# default-branch context, where it belongs.
#
# Why deployment exists at all: the ar-manager image bakes in the documentation
# corpus that grounds memory_recall. Under hand-run deploys that corpus drifts
# from the repository with no signal — answers stay confident while going stale.
#
# Only master, and only after a green pipeline.

on:
  workflow_run:
    workflows: ["Build and Test"]
    types: [completed]
  workflow_dispatch:
    inputs:
      redeploy_agents:
        description: 'Rebuild and recreate the agent pool (flowtree-agent-1/-2) as well as the controller stack'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      skip_drain:
        description: 'Deploy without waiting for in-flight agent jobs to finish (they will lose their ar-manager connection)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

# One deploy at a time. Do NOT cancel in progress: interrupting a half-finished
# container rebuild is worse than queueing behind it.
concurrency:
  group: deploy-controller-stack
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.head_branch == 'master' &&
       github.event.workflow_run.conclusion == 'success')
    # Native macOS runner on the host that owns the stack, with Docker
    # available to the runner user. The label is deliberately distinct from
    # `ar-ci` (the same reasoning as `ar-ci-cl`): a deploy must not queue
    # behind the macOS test lane, and the test lane must not pick up deploys.
    runs-on: [self-hosted, macos, ar-deploy]
    # Approval gate. Configure under: Settings -> Environments -> production
    environment: production
    permissions:
      contents: read
    env:
      # workflow_run carries no inputs, so an automatic master deploy falls
      # through to the repository variable, and to 'true' when that is unset:
      # the agent pool tracks master by default, exactly as the controller
      # stack does. Set FLOWTREE_DEPLOY_AGENTS=false to opt the pool out.
      DEPLOY_AGENTS: ${{ github.event.inputs.redeploy_agents || vars.FLOWTREE_DEPLOY_AGENTS || 'true' }}
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          # workflow_run does not check out the triggering ref by default.
          ref: master
          fetch-depth: 0

      - name: Stop accepting new agent jobs
        id: quiesce
        env:
          CONTROLLER_URL: ${{ vars.FLOWTREE_LOCAL_CONTROLLER_URL || 'http://localhost:7780' }}
        run: |
          # Close intake first so the set of in-flight jobs can only shrink
          # while we wait for it below.
          if curl -fsS -X POST "$CONTROLLER_URL/api/config/accept-automated-jobs" \
               -H 'Content-Type: application/json' -d '{"accept":false}' >/dev/null; then
            echo "reopen=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Job intake closed for the duration of the deploy"
          else
            # A controller that is already down needs no draining, and must not
            # block a deploy that may be the thing that fixes it.
            echo "reopen=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Controller unreachable — skipping drain"
          fi

      - name: Wait for in-flight agent jobs to finish
        if: >-
          steps.quiesce.outputs.reopen == 'true' &&
          github.event.inputs.skip_drain != 'true'
        env:
          CONTROLLER_URL: ${{ vars.FLOWTREE_LOCAL_CONTROLLER_URL || 'http://localhost:7780' }}
          DRAIN_TIMEOUT_SECONDS: '1800'
        run: ./tools/ci/drain-agent-jobs.sh

      - name: Record the agent containers being replaced
        # force-recreate always yields a NEW container id, so comparing ids
        # across the rebuild is what proves the pool was actually replaced
        # rather than left running on the previous image. Timestamps would be
        # equally valid but need RFC3339 parsing that differs between BSD and
        # GNU date.
        id: agents_before
        if: env.DEPLOY_AGENTS == 'true'
        run: |
          for n in 1 2; do
            name="flowtree-agent-${n}"
            id="$(docker inspect -f '{{.Id}}' "$name" 2>/dev/null || echo none)"
            # Underscored output names: GitHub expressions read a hyphen in a
            # property name as subtraction.
            echo "agent_${n}=${id}" >> "$GITHUB_OUTPUT"
            echo "::notice::${name} before deploy: ${id}"
          done

      - name: Rebuild and restart the controller stack
        # rebuild.sh owns the whole build: it runs `mvn install -pl
        # flowtree/runtime -am -DskipTests` and then dependency:copy-dependencies,
        # which the controller Dockerfile's COPY depends on. Do not add a
        # separate Maven step here — a plain `install` does not produce
        # target/dependency, and a full-reactor build would be redundant.
        #
        # No --cache. The script's own comment records why: cached COPY layers
        # let a rebuild "succeed" while the running image is the previous one,
        # which is exactly how stale bundled source shipped once before. That
        # failure mode is the one this deployment exists to prevent — a cached
        # docs layer would leave ar-manager answering from an old corpus while
        # reporting a successful deploy.
        #
        # --agents extends the same rebuild to the agent pool. The agent image
        # bundles the flowtree JARs, so any change under flowtree/agents (the
        # tool policy an agent session runs under, for instance) reaches a
        # running agent ONLY through this flag; a controller-only deploy leaves
        # flowtree-agent-1/-2 on the JARs they were last built with.
        env:
          # The agent .env is gitignored and therefore absent from this
          # checkout. Point rebuild.sh at the host's copy, which lives beside
          # the other deploy secrets.
          FLOWTREE_AGENT_ENV: ${{ vars.FLOWTREE_AGENT_ENV }}
        run: |
          if [ -z "${FLOWTREE_AGENT_ENV}" ] \
             && [ -f /Users/Shared/flowtree/secrets/agent.env ]; then
            export FLOWTREE_AGENT_ENV=/Users/Shared/flowtree/secrets/agent.env
          fi
          if [ "${DEPLOY_AGENTS}" = 'true' ]; then
            ./flowtree/runtime/rebuild.sh --agents
          else
            echo "::notice::Agent pool left untouched (DEPLOY_AGENTS=${DEPLOY_AGENTS})"
            ./flowtree/runtime/rebuild.sh
          fi

      - name: Verify the stack came back up
        env:
          CONTROLLER_URL: ${{ vars.FLOWTREE_LOCAL_CONTROLLER_URL || 'http://localhost:7780' }}
          MANAGER_URL: ${{ vars.AR_MANAGER_LOCAL_URL || 'http://localhost:8010' }}
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS "$CONTROLLER_URL/api/health" >/dev/null \
               && curl -fsS "$MANAGER_URL/_health" >/dev/null; then
              echo "::notice::Controller and ar-manager healthy"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Stack did not become healthy within 300s"
          exit 1

      - name: Verify the documentation corpus is live
        env:
          MANAGER_URL: ${{ vars.AR_MANAGER_LOCAL_URL || 'http://localhost:8010' }}
        run: |
          # The corpus reaching the image is checked at build time; this
          # confirms the container actually running is the one that has it.
          COUNT=$(docker compose -f flowtree/runtime/controller/docker-compose.yml \
            exec -T ar-manager sh -c 'find $AR_DOCS_DIR -name "*.md" | wc -l' || echo 0)
          echo "::notice::Documentation files in the running ar-manager: $COUNT"
          if [ "$COUNT" -lt 50 ]; then
            echo "::error::Running ar-manager has no usable documentation corpus ($COUNT files)."
            exit 1
          fi

      - name: Verify the agent pool was replaced
        if: env.DEPLOY_AGENTS == 'true'
        env:
          BEFORE_AGENT_1: ${{ steps.agents_before.outputs.agent_1 }}
          BEFORE_AGENT_2: ${{ steps.agents_before.outputs.agent_2 }}
        run: |
          # A rebuild that "succeeded" while the old containers kept running is
          # the failure this option exists to fix; assert the replacement
          # instead of trusting the exit code.
          status=0
          for name in flowtree-agent-1 flowtree-agent-2; do
            case "$name" in
              flowtree-agent-1) before="$BEFORE_AGENT_1" ;;
              flowtree-agent-2) before="$BEFORE_AGENT_2" ;;
            esac
            after="$(docker inspect -f '{{.Id}}' "$name" 2>/dev/null || echo none)"
            running="$(docker inspect -f '{{.State.Running}}' "$name" 2>/dev/null || echo false)"
            if [ "$after" = none ] || [ "$running" != true ]; then
              echo "::error::$name is not running after the deploy"
              status=1
            elif [ "$after" = "$before" ]; then
              echo "::error::$name was not recreated — still container $after, running the previous image"
              status=1
            else
              echo "::notice::$name recreated as $after"
            fi
          done
          exit $status

      - name: Resume accepting agent jobs
        # always(): intake must be reopened even when a step above failed,
        # or a failed deploy leaves the controller permanently quiesced.
        if: always() && steps.quiesce.outputs.reopen == 'true'
        env:
          CONTROLLER_URL: ${{ vars.FLOWTREE_LOCAL_CONTROLLER_URL || 'http://localhost:7780' }}
        run: |
          curl -fsS -X POST "$CONTROLLER_URL/api/config/accept-automated-jobs" \
            -H 'Content-Type: application/json' -d '{"accept":true}' >/dev/null \
            && echo "::notice::Job intake reopened" \
            || echo "::error::FAILED to reopen job intake — do this manually: POST {\"accept\":true} to $CONTROLLER_URL/api/config/accept-automated-jobs"
