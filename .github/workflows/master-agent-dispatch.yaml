name: "Master Agent Dispatch"

# The agent jobs that fire on a merge to master.
#
# These were three separate workflows (Project Manager, Quality Assurance,
# Defect Hunt) with byte-identical triggers. They are one workflow with three
# jobs because a workflow per lifecycle event keeps the Actions UI navigable;
# a separate file per job multiplies the sidebar without separating anything.
#
# Each job keeps its own concurrency group, so they still serialize
# independently rather than queueing behind each other. Cadence and cleanup for
# the two QA-style jobs stay in tools/ci/qa-cadence.sh and
# tools/ci/archive-stale-workstreams.sh, which they already shared.
#
# A manual run selects one job with the `agent` input, or `all` to run the same
# set a merge would. Deploy deliberately remains its own workflow: it is
# triggered by hand often enough that it earns a dedicated entry.

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      agent:
        description: "Which dispatch to run"
        required: false
        default: "all"
        type: choice
        options:
          - "all"
          - "project-manager"
          - "quality-assurance"
          - "defect-hunt"
          - "coverage"
      force:
        description: "Submit even if at capacity or one ran recently"
        required: false
        default: "false"
      plan_title:
        description: "Project Manager only — short title, used in the planning branch name"
        required: false
        default: ""
      plan_content:
        description: "Project Manager only — markdown seeding the branch's plan document"
        required: false
        default: ""

jobs:
  # ── Project Manager ──────────────────────────────────────────────────
  # Maintains a fixed number of active project branches by creating a new
  # planning task whenever a branch is merged.
  plan-next-task:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.agent == 'all' ||
      github.event.inputs.agent == 'project-manager'
    runs-on: [self-hosted, macos, ar-ci]
    permissions:
      contents: write
      pull-requests: write

    # Only one project-manager run at a time to avoid race conditions
    # when counting branches and creating new ones.
    concurrency:
      group: project-manager
      cancel-in-progress: false

    env:
      # Target number of active project branches to maintain.
      # When the count drops below this, a new planning branch is created.
      PROJECT_BRANCH_TARGET: "3"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Count active project branches
        id: branches
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Count open PRs targeting master via the GitHub CLI. The previous
          # ar-github MCP CLI mode was retired when the tool was consolidated
          # into ar-manager; ar-manager is an HTTP MCP server and is not
          # invokable from a CI shell step.
          OPEN_PR_COUNT=$(gh pr list --base master --state open --json number --jq 'length')
          echo "open_prs=$OPEN_PR_COUNT" >> "$GITHUB_OUTPUT"
          echo "target=$PROJECT_BRANCH_TARGET" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "needs_new_branch=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Force mode — creating new planning branch regardless of count"
          elif [ "$OPEN_PR_COUNT" -lt "$PROJECT_BRANCH_TARGET" ]; then
            echo "needs_new_branch=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Open PRs ($OPEN_PR_COUNT) below target ($PROJECT_BRANCH_TARGET) — creating new planning branch"
          else
            echo "needs_new_branch=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Open PRs ($OPEN_PR_COUNT) at or above target ($PROJECT_BRANCH_TARGET) — no new branch needed"
          fi

      # The timestamp stays in the name even when a title is given: two
      # dispatches of the same title on the same day would otherwise collide on
      # an existing branch.
      #
      # plan_title is free text from a dispatch input, so it is read through the
      # environment rather than interpolated into the script — a title
      # containing shell metacharacters must not be able to run as code. The
      # substitutions are POSIX: this job runs on macOS, whose sed does not
      # understand GNU's \+.
      - name: Create planning branch
        if: steps.branches.outputs.needs_new_branch == 'true'
        id: new_branch
        env:
          PLAN_TITLE: ${{ github.event.inputs.plan_title }}
        run: |
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          SLUG=$(printf '%s' "${PLAN_TITLE:-}" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -e 's/[^a-z0-9][^a-z0-9]*/-/g' -e 's/^-//' -e 's/-$//' \
            | cut -c1-40 | sed -e 's/-$//')

          if [ -n "$SLUG" ]; then
            BRANCH_NAME="project/plan-${TIMESTAMP}-${SLUG}"
          else
            BRANCH_NAME="project/plan-${TIMESTAMP}"
          fi

          git checkout -b "$BRANCH_NAME"
          git push -u origin "$BRANCH_NAME"
          echo "branch=$BRANCH_NAME" >> "$GITHUB_OUTPUT"
          echo "slug=${SLUG:-seed}" >> "$GITHUB_OUTPUT"
          echo "::notice::Created branch $BRANCH_NAME"

      # When the caller supplied plan_content, that markdown IS the branch's
      # plan document: commit it before the agent starts so the agent refines a
      # stated task instead of inventing one. It is committed rather than passed
      # through the prompt so the branch carries exactly one new plan document,
      # which is what Verify Completion detects.
      - name: Seed plan document
        if: >-
          steps.branches.outputs.needs_new_branch == 'true' &&
          github.event.inputs.plan_content != ''
        id: seed
        env:
          PLAN_CONTENT: ${{ github.event.inputs.plan_content }}
          SLUG: ${{ steps.new_branch.outputs.slug }}
          BRANCH: ${{ steps.new_branch.outputs.branch }}
        run: |
          PLAN_FILE="docs/plans/PLAN-$(date +%Y%m%d)-${SLUG}.md"
          mkdir -p docs/plans
          printf '%s\n' "$PLAN_CONTENT" > "$PLAN_FILE"

          git add "$PLAN_FILE"
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Seed planning document for ${BRANCH}"
          git push

          echo "plan_file=$PLAN_FILE" >> "$GITHUB_OUTPUT"
          echo "::notice::Seeded $PLAN_FILE"

      - name: Register workstream
        if: steps.branches.outputs.needs_new_branch == 'true'
        env:
          CONTROLLER_HOST: ${{ secrets.FLOWTREE_CONTROLLER_HOST || 'mac-studio' }}
          CONTROLLER_PORT: ${{ secrets.FLOWTREE_CONTROLLER_PORT || '7780' }}
          BRANCH: ${{ steps.new_branch.outputs.branch }}
          BASE_BRANCH: master
          REPO_URL: git@github.com:${{ github.repository }}.git
        run: |
          chmod +x ./tools/ci/register-workstream.sh
          ./tools/ci/register-workstream.sh

      - name: Build planning prompt
        if: steps.branches.outputs.needs_new_branch == 'true'
        env:
          BRANCH: ${{ steps.new_branch.outputs.branch }}
          BASE_BRANCH: master
          PLAN_DOCUMENT: ${{ steps.seed.outputs.plan_file }}
        run: |
          ./tools/ci/prompts/build-planning-prompt.sh "${{ runner.temp }}/agent-prompt.txt"

      - name: Submit planning agent job
        if: steps.branches.outputs.needs_new_branch == 'true'
        env:
          CONTROLLER_HOST: ${{ secrets.FLOWTREE_CONTROLLER_HOST || 'mac-studio' }}
          CONTROLLER_PORT: ${{ secrets.FLOWTREE_CONTROLLER_PORT || '7780' }}
          BRANCH: ${{ steps.new_branch.outputs.branch }}
          BASE_BRANCH: master
          DESCRIPTION: "Plan new work branch"
          AUTO_CREATE_PR: "true"
        run: |
          ./tools/ci/submit-agent-job.sh "${{ runner.temp }}/agent-prompt.txt"

      - name: Summary
        if: always()
        run: |
          echo "## Project Manager" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Open PRs:** ${{ steps.branches.outputs.open_prs }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Target:** ${{ steps.branches.outputs.target }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.branches.outputs.needs_new_branch }}" = "true" ]; then
            echo "Created new planning branch: \`${{ steps.new_branch.outputs.branch }}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            if [ -n "${{ steps.seed.outputs.plan_file }}" ]; then
              echo "Seeded \`${{ steps.seed.outputs.plan_file }}\` and submitted a FlowTree coding" >> "$GITHUB_STEP_SUMMARY"
              echo "agent job to refine it into a complete plan." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "A FlowTree coding agent job was submitted to investigate the project" >> "$GITHUB_STEP_SUMMARY"
              echo "and propose a new task." >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "No new branch needed — active branch count is at or above target." >> "$GITHUB_STEP_SUMMARY"
          fi

  # ── Quality Assurance — Documentation ────────────────────────────────
  # Submits a FlowTree coding-agent job that reviews the documentation for
  # staleness against the changes merged over the last week and opens a PR with
  # any fixes.
  #
  # Cadence is shared with the defect hunt via tools/ci/qa-cadence.sh: skip
  # while a previous round's PR is still open, otherwise run at most once per
  # MIN_INTERVAL_DAYS. A dispatch with force=true bypasses both.
  #
  # This replaced a once-per-UTC-day cap held in the GitHub Actions cache. The
  # cache was not durable enough to hold it: the branch names it produced show
  # five separate days with two rounds each, and 26 abandoned workstreams had
  # accumulated behind them. Every cache miss silently authorised an extra run,
  # and a miss is invisible. The branch list is the same state the job already
  # produces, cannot drift from it, and carries the timestamp in the name.
  doc-qa:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.agent == 'all' ||
      github.event.inputs.agent == 'quality-assurance'
    runs-on: [self-hosted, macos, ar-ci]
    permissions:
      contents: write
      pull-requests: write

    # Serialize so two merges landing together cannot both pass the gate.
    concurrency:
      group: quality-assurance
      cancel-in-progress: false

    env:
      # The window of recent history the agent reviews for documentation drift.
      # Passed to the prompt as a git --since expression.
      REVIEW_SINCE: "1 week ago"
      BRANCH_PREFIX: "qa/docs-"
      MIN_INTERVAL_DAYS: "7"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide whether to submit
        id: decide
        env:
          BRANCH_PREFIX: ${{ env.BRANCH_PREFIX }}
          MIN_INTERVAL_DAYS: ${{ env.MIN_INTERVAL_DAYS }}
          FORCE: ${{ github.event.inputs.force }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x ./tools/ci/qa-cadence.sh
          ./tools/ci/qa-cadence.sh

      # Retire the rounds that came before this one. Safe here because the
      # gate above has already established that none of them has an open PR:
      # anything still registered has been merged, closed, or abandoned.
      # Archiving is reversible.
      - name: Archive previous rounds
        if: steps.decide.outputs.run == 'true'
        env:
          CONTROLLER_HOST: ${{ secrets.FLOWTREE_CONTROLLER_HOST || 'mac-studio' }}
          CONTROLLER_PORT: ${{ secrets.FLOWTREE_CONTROLLER_PORT || '7780' }}
          BRANCH_PREFIX: ${{ env.BRANCH_PREFIX }}
          REPO_URL: git@github.com:${{ github.repository }}.git
        run: |
          chmod +x ./tools/ci/archive-stale-workstreams.sh
          ./tools/ci/archive-stale-workstreams.sh

      # A fresh branch for the agent to work on. It is pushed before submission
      # so the agent's targetBranch exists; AUTO_CREATE_PR opens the PR once the
      # agent commits its fixes. When the docs are already current the agent
      # makes no changes and no PR is opened, leaving an empty branch at
      # master's HEAD — which the next round's gate then reads as the last run.
      - name: Create QA branch
        if: steps.decide.outputs.run == 'true'
        id: qa_branch
        run: |
          TIMESTAMP=$(date -u +%Y%m%d-%H%M%S)
          BRANCH_NAME="${BRANCH_PREFIX}${TIMESTAMP}"
          git checkout -b "$BRANCH_NAME"
          git push -u origin "$BRANCH_NAME"
          echo "branch=$BRANCH_NAME" >> "$GITHUB_OUTPUT"
          echo "::notice::Created branch $BRANCH_NAME"

      - name: Register workstream
        if: steps.decide.outputs.run == 'true'
        env:
          CONTROLLER_HOST: ${{ secrets.FLOWTREE_CONTROLLER_HOST || 'mac-studio' }}
          CONTROLLER_PORT: ${{ secrets.FLOWTREE_CONTROLLER_PORT || '7780' }}
          BRANCH: ${{ steps.qa_branch.outputs.branch }}
          BASE_BRANCH: master
          REPO_URL: git@github.com:${{ github.repository }}.git
        run: |
          chmod +x ./tools/ci/register-workstream.sh
          ./tools/ci/register-workstream.sh

      - name: Build documentation QA prompt
        if: steps.decide.outputs.run == 'true'
        env:
          BRANCH: ${{ steps.qa_branch.outputs.branch }}
          BASE_BRANCH: master
          REVIEW_SINCE: ${{ env.REVIEW_SINCE }}
        run: |
          ./tools/ci/prompts/build-doc-qa-prompt.sh "${{ runner.temp }}/agent-prompt.txt"

      - name: Submit documentation QA agent job
        if: steps.decide.outputs.run == 'true'
        env:
          CONTROLLER_HOST: ${{ secrets.FLOWTREE_CONTROLLER_HOST || 'mac-studio' }}
          CONTROLLER_PORT: ${{ secrets.FLOWTREE_CONTROLLER_PORT || '7780' }}
          BRANCH: ${{ steps.qa_branch.outputs.branch }}
          BASE_BRANCH: master
          DESCRIPTION: "Review documentation for staleness"
          PROTECT_TEST_FILES: "true"
          AUTO_CREATE_PR: "true"
        run: |
          ./tools/ci/submit-agent-job.sh "${{ runner.temp }}/agent-prompt.txt"

      - name: Summary
        if: always()
        run: |
          echo "## Quality Assurance — Documentation" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Decision:** \`${{ steps.decide.outputs.run }}\` (${{ steps.decide.outputs.reason }})" >> "$GITHUB_STEP_SUMMARY"
          echo "**Minimum interval:** ${{ env.MIN_INTERVAL_DAYS }} days" >> "$GITHUB_STEP_SUMMARY"
          echo "**Review window:** ${{ env.REVIEW_SINCE }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.decide.outputs.run }}" = "true" ]; then
            echo "Created \`${{ steps.qa_branch.outputs.branch }}\` and submitted a FlowTree" >> "$GITHUB_STEP_SUMMARY"
            echo "coding agent job to review documentation for staleness and open a PR with any fixes." >> "$GITHUB_STEP_SUMMARY"
          else
            case "${{ steps.decide.outputs.reason }}" in
              pr-open) echo "Skipped: a previous documentation QA PR is still open. Review or close it first." >> "$GITHUB_STEP_SUMMARY" ;;
              too-recent) echo "Skipped: the last review is younger than the minimum interval." >> "$GITHUB_STEP_SUMMARY" ;;
              pr-query-failed) echo "Skipped: could not reach the GitHub API to check for an open PR." >> "$GITHUB_STEP_SUMMARY" ;;
              pr-page-limit) echo "Skipped: too many open PRs to page through; assumed a previous round is still open." >> "$GITHUB_STEP_SUMMARY" ;;
              *) echo "Skipped: ${{ steps.decide.outputs.reason }}" >> "$GITHUB_STEP_SUMMARY" ;;
            esac
          fi

  # ── Defect Hunt ──────────────────────────────────────────────────────
  # Submits a FlowTree coding-agent job that goes looking for a real defect
  # anywhere in the repository, proves it with a failing test, and fixes it
  # if it can.
  #
  # Distinct from the documentation review in two ways. That job is scoped
  # to what changed recently; this one is deliberately unscoped, because
  # the defects that survive longest live in code nobody has looked at
  # lately. And this one pins the primary phase to opus regardless of the
  # workspace default: the work is hypothesis-forming and adversarial
  # rather than mechanical, and it is the phase where model capability
  # actually decides whether anything is found.
  #
  # Cadence and cleanup are shared with the documentation review through
  # tools/ci/qa-cadence.sh and tools/ci/archive-stale-workstreams.sh. The
  # gate is: skip while a previous round's PR is still open, otherwise run
  # at most once per MIN_INTERVAL_DAYS.
  defect-hunt:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.agent == 'all' ||
      github.event.inputs.agent == 'defect-hunt'
    runs-on: [self-hosted, macos, ar-ci]
    permissions:
      contents: write
      pull-requests: write

    # Serialize so two merges landing together cannot both pass the gate.
    concurrency:
      group: defect-hunt
      cancel-in-progress: false

    env:
      BRANCH_PREFIX: "qa/defect-"
      MIN_INTERVAL_DAYS: "7"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide whether to submit
        id: decide
        env:
          BRANCH_PREFIX: ${{ env.BRANCH_PREFIX }}
          MIN_INTERVAL_DAYS: ${{ env.MIN_INTERVAL_DAYS }}
          FORCE: ${{ github.event.inputs.force }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x ./tools/ci/qa-cadence.sh
          ./tools/ci/qa-cadence.sh

      # Retire the rounds that came before this one. Safe here because the
      # gate above has already established that none of them has an open
      # PR: anything still registered has been merged, closed, or
      # abandoned. Archiving is reversible.
      - name: Archive previous rounds
        if: steps.decide.outputs.run == 'true'
        env:
          CONTROLLER_HOST: ${{ secrets.FLOWTREE_CONTROLLER_HOST || 'mac-studio' }}
          CONTROLLER_PORT: ${{ secrets.FLOWTREE_CONTROLLER_PORT || '7780' }}
          BRANCH_PREFIX: ${{ env.BRANCH_PREFIX }}
          REPO_URL: git@github.com:${{ github.repository }}.git
        run: |
          chmod +x ./tools/ci/archive-stale-workstreams.sh
          ./tools/ci/archive-stale-workstreams.sh

      - name: Create defect-hunt branch
        if: steps.decide.outputs.run == 'true'
        id: branch
        run: |
          TIMESTAMP=$(date -u +%Y%m%d-%H%M%S)
          BRANCH_NAME="${BRANCH_PREFIX}${TIMESTAMP}"
          git checkout -b "$BRANCH_NAME"
          git push -u origin "$BRANCH_NAME"
          echo "branch=$BRANCH_NAME" >> "$GITHUB_OUTPUT"
          echo "::notice::Created branch $BRANCH_NAME"

      - name: Register workstream
        if: steps.decide.outputs.run == 'true'
        env:
          CONTROLLER_HOST: ${{ secrets.FLOWTREE_CONTROLLER_HOST || 'mac-studio' }}
          CONTROLLER_PORT: ${{ secrets.FLOWTREE_CONTROLLER_PORT || '7780' }}
          BRANCH: ${{ steps.branch.outputs.branch }}
          BASE_BRANCH: master
          REPO_URL: git@github.com:${{ github.repository }}.git
        run: |
          chmod +x ./tools/ci/register-workstream.sh
          ./tools/ci/register-workstream.sh

      - name: Build defect-hunt prompt
        if: steps.decide.outputs.run == 'true'
        env:
          BRANCH: ${{ steps.branch.outputs.branch }}
          BASE_BRANCH: master
        run: |
          chmod +x ./tools/ci/prompts/build-defect-hunt-prompt.sh
          ./tools/ci/prompts/build-defect-hunt-prompt.sh "${{ runner.temp }}/agent-prompt.txt"

      # PHASE_CONFIGS pins only the primary phase, so the review,
      # deduplication and commit-message phases keep whatever the
      # workspace configures for them. Pinning the default instead would
      # silently move every phase onto opus.
      #
      # All three of runner, model and provider are set together, because
      # the merge against the workspace default is field-by-field. Setting
      # the model alone left the workspace's runner and provider in place
      # and produced "opencode/opus, provider=openrouter" — opencode
      # declares no supported-model set, so nothing rejected it at submit
      # time and the phase died in two seconds against an OpenRouter
      # endpoint with no such model. Setting runner without provider fails
      # the other way: the claude runner accepts provider=anthropic only,
      # so an inherited openrouter is rejected outright.
      - name: Submit defect-hunt agent job
        if: steps.decide.outputs.run == 'true'
        env:
          CONTROLLER_HOST: ${{ secrets.FLOWTREE_CONTROLLER_HOST || 'mac-studio' }}
          CONTROLLER_PORT: ${{ secrets.FLOWTREE_CONTROLLER_PORT || '7780' }}
          BRANCH: ${{ steps.branch.outputs.branch }}
          BASE_BRANCH: master
          DESCRIPTION: "Hunt for a defect and prove it with a failing test"
          PROTECT_TEST_FILES: "true"
          AUTO_CREATE_PR: "true"
          PHASE_CONFIGS: '{"primary": {"runner": "claude", "model": "opus", "provider": "anthropic"}}'
        run: |
          ./tools/ci/submit-agent-job.sh "${{ runner.temp }}/agent-prompt.txt"

      - name: Summary
        if: always()
        run: |
          echo "## Defect Hunt" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Decision:** \`${{ steps.decide.outputs.run }}\` (${{ steps.decide.outputs.reason }})" >> "$GITHUB_STEP_SUMMARY"
          echo "**Minimum interval:** ${{ env.MIN_INTERVAL_DAYS }} days" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.decide.outputs.run }}" = "true" ]; then
            echo "Created \`${{ steps.branch.outputs.branch }}\` and submitted a defect-hunt job" >> "$GITHUB_STEP_SUMMARY"
            echo "with the primary phase pinned to claude/opus (provider anthropic)." >> "$GITHUB_STEP_SUMMARY"
          else
            case "${{ steps.decide.outputs.reason }}" in
              pr-open) echo "Skipped: a previous defect-hunt PR is still open. Review or close it first." >> "$GITHUB_STEP_SUMMARY" ;;
              too-recent) echo "Skipped: the last defect hunt is younger than the minimum interval." >> "$GITHUB_STEP_SUMMARY" ;;
              pr-query-failed) echo "Skipped: could not reach the GitHub API to check for an open PR." >> "$GITHUB_STEP_SUMMARY" ;;
              pr-page-limit) echo "Skipped: too many open PRs to page through; assumed a previous round is still open." >> "$GITHUB_STEP_SUMMARY" ;;
              *) echo "Skipped: ${{ steps.decide.outputs.reason }}" >> "$GITHUB_STEP_SUMMARY" ;;
            esac
          fi

  # ── Quality Assurance — Test Coverage ────────────────────────────────
  # Submits a FlowTree coding-agent job that raises the line coverage of
  # the single worst-covered, still-improvable Java package or Python
  # directory.
  #
  # Cadence and cleanup are shared with the other two QA-style jobs
  # through tools/ci/qa-cadence.sh and tools/ci/archive-stale-workstreams.sh:
  # skip while a previous round's PR is still open, otherwise run at most
  # once per MIN_INTERVAL_DAYS. Distinct from both: a target-selection step
  # runs between the cadence gate and everything else, and can itself
  # decide there is nothing to do (every eligible unit is excluded, on
  # cooldown, or already at threshold) — a clean "nothing to do" exit, the
  # same standing a docs round with no drift or a defect hunt with no
  # finding already has.
  coverage-qa:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.agent == 'all' ||
      github.event.inputs.agent == 'coverage'
    runs-on: [self-hosted, macos, ar-ci]
    permissions:
      contents: write
      pull-requests: write

    # Serialize so two merges landing together cannot both pass the gate.
    concurrency:
      group: coverage-qa
      cancel-in-progress: false

    env:
      BRANCH_PREFIX: "qa/coverage-"
      MIN_INTERVAL_DAYS: "7"
      # A single global threshold: COVERAGE_THRESHOLD_PYTHON is
      # deliberately left unset here so select-target.py falls back to
      # this value for Python units too. Set COVERAGE_THRESHOLD_PYTHON
      # explicitly to give Python its own (likely lower, at least
      # initially) bar once that is warranted.
      COVERAGE_THRESHOLD: "80"
      MIN_LINES: "50"
      COOLDOWN_DAYS: "30"
      MAX_ATTEMPTS: "2"
      MIN_PROGRESS: "5"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide whether to submit
        id: decide
        env:
          BRANCH_PREFIX: ${{ env.BRANCH_PREFIX }}
          MIN_INTERVAL_DAYS: ${{ env.MIN_INTERVAL_DAYS }}
          FORCE: ${{ github.event.inputs.force }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x ./tools/ci/qa-cadence.sh
          ./tools/ci/qa-cadence.sh

      # Reuses the latest master "Build and Test" run's merged JaCoCo
      # report by default (seconds) rather than re-running the hours-long
      # suite; recomputes Python fresh either way (it runs in seconds).
      # See tools/ci/coverage/fetch-latest-coverage.sh for the FORCE=true
      # recompute path.
      - name: Fetch latest coverage report
        if: steps.decide.outputs.run == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          chmod +x ./tools/ci/coverage/fetch-latest-coverage.sh
          ./tools/ci/coverage/fetch-latest-coverage.sh

      - name: Select target
        if: steps.decide.outputs.run == 'true'
        id: select
        env:
          COVERAGE_THRESHOLD: ${{ env.COVERAGE_THRESHOLD }}
          MIN_LINES: ${{ env.MIN_LINES }}
          COOLDOWN_DAYS: ${{ env.COOLDOWN_DAYS }}
          MAX_ATTEMPTS: ${{ env.MAX_ATTEMPTS }}
          MIN_PROGRESS: ${{ env.MIN_PROGRESS }}
        run: |
          chmod +x ./tools/ci/coverage/select-target.py
          ./tools/ci/coverage/select-target.py

      # select-target.py's give-up marker may have appended a new entry to
      # coverage-exclusions.txt (a unit attempted MAX_ATTEMPTS times without
      # MIN_PROGRESS points of gain) while scanning ALL units — independent
      # of whether this round itself selected a target. When a target IS
      # selected (the common case) that append rides on the round's own
      # branch instead (see "Commit any new auto-exclusions to the coverage
      # branch" below), so it goes through the same PR and human review as
      # everything else the round produces. This step only handles the
      # remaining case: nothing is eligible this round, so no branch is
      # created for the append to ride on.
      #
      # Persisting it here is a pure optimization, never a correctness
      # requirement: select-target.py derives give-up state from
      # tools/coverage-data/coverage-history.tsv at runtime (is_given_up()), so the
      # next round skips this unit regardless of whether this push lands.
      # A direct push to master can fail under branch protection or race
      # with a concurrent merge, so failure is handled explicitly rather
      # than left to the shell's default "a failing command fails the
      # step" behavior — this must never fail the workflow, and it runs
      # after target selection, so it can never change what was (or was
      # not) selected above.
      - name: Best-effort commit of auto-exclusions when no round opens
        if: steps.decide.outputs.run == 'true' && steps.select.outputs.target == ''
        run: |
          if ! git diff --quiet -- tools/coverage-data/coverage-exclusions.txt; then
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                add tools/coverage-data/coverage-exclusions.txt
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -m "Auto-exclude a coverage-qa target that made no sustained progress"
            if git push origin master; then
              echo "::notice::Committed a new auto-exclusion entry to tools/coverage-data/coverage-exclusions.txt"
            else
              echo "::warning::Best-effort push of the auto-exclusion entry to master failed (branch protection or a concurrent merge) and no round was opened this run to carry it instead. This is non-fatal: select-target.py re-derives give-up state from tools/coverage-data/coverage-history.tsv at runtime, so the unit stays excluded from the next round regardless of whether this push lands."
            fi
          fi

      # Retire the rounds that came before this one. Safe here because the
      # gate above has already established that none of them has an open
      # PR: anything still registered has been merged, closed, or
      # abandoned. Archiving is reversible. Only runs once a target is
      # actually selected — a "nothing to do" decision should not touch
      # the backlog of a real, still-open concern.
      - name: Archive previous rounds
        if: steps.decide.outputs.run == 'true' && steps.select.outputs.target != ''
        env:
          CONTROLLER_HOST: ${{ secrets.FLOWTREE_CONTROLLER_HOST || 'mac-studio' }}
          CONTROLLER_PORT: ${{ secrets.FLOWTREE_CONTROLLER_PORT || '7780' }}
          BRANCH_PREFIX: ${{ env.BRANCH_PREFIX }}
          REPO_URL: git@github.com:${{ github.repository }}.git
        run: |
          chmod +x ./tools/ci/archive-stale-workstreams.sh
          ./tools/ci/archive-stale-workstreams.sh

      - name: Create coverage branch
        if: steps.decide.outputs.run == 'true' && steps.select.outputs.target != ''
        id: branch
        run: |
          TIMESTAMP=$(date -u +%Y%m%d-%H%M%S)
          BRANCH_NAME="${BRANCH_PREFIX}${TIMESTAMP}"
          git checkout -b "$BRANCH_NAME"
          git push -u origin "$BRANCH_NAME"
          echo "branch=$BRANCH_NAME" >> "$GITHUB_OUTPUT"
          echo "::notice::Created branch $BRANCH_NAME"

      # Puts any give-up auto-exclusion select-target.py wrote (working-tree
      # only so far) onto this round's own branch, so it is reviewed as part
      # of the round's PR rather than by an unreviewed direct push to
      # master. Unlike the master push above, this is an ordinary push to a
      # brand-new branch this same job just created and pushed — the same
      # operation "Create coverage branch" already performs — so it is not
      # wrapped as best-effort; a failure here is a real problem for the
      # round (the branch push right above it already assumes success with
      # no fallback either) and should fail the job like any other setup
      # step failure would.
      - name: Commit any new auto-exclusions to the coverage branch
        if: steps.decide.outputs.run == 'true' && steps.select.outputs.target != ''
        run: |
          if ! git diff --quiet -- tools/coverage-data/coverage-exclusions.txt; then
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                add tools/coverage-data/coverage-exclusions.txt
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -m "Auto-exclude a coverage-qa target that made no sustained progress"
            git push origin "${{ steps.branch.outputs.branch }}"
            echo "::notice::Committed a new auto-exclusion entry on ${{ steps.branch.outputs.branch }}; it will land in this round's PR"
          fi

      - name: Register workstream
        if: steps.decide.outputs.run == 'true' && steps.select.outputs.target != ''
        env:
          CONTROLLER_HOST: ${{ secrets.FLOWTREE_CONTROLLER_HOST || 'mac-studio' }}
          CONTROLLER_PORT: ${{ secrets.FLOWTREE_CONTROLLER_PORT || '7780' }}
          BRANCH: ${{ steps.branch.outputs.branch }}
          BASE_BRANCH: master
          REPO_URL: git@github.com:${{ github.repository }}.git
        run: |
          chmod +x ./tools/ci/register-workstream.sh
          ./tools/ci/register-workstream.sh

      - name: Build coverage prompt
        if: steps.decide.outputs.run == 'true' && steps.select.outputs.target != ''
        env:
          BRANCH: ${{ steps.branch.outputs.branch }}
          BASE_BRANCH: master
          TARGET: ${{ steps.select.outputs.target }}
          TARGET_LANGUAGE: ${{ steps.select.outputs.language }}
          CURRENT_COVERAGE: ${{ steps.select.outputs.current }}
          COVERAGE_THRESHOLD: ${{ env.COVERAGE_THRESHOLD }}
        run: |
          chmod +x ./tools/ci/prompts/build-coverage-prompt.sh
          ./tools/ci/prompts/build-coverage-prompt.sh "${{ runner.temp }}/agent-prompt.txt"

      # PROTECT_TEST_FILES stays "true" and no sensitive-file bypass is
      # requested: a coverage round only ever adds new tests, appends to
      # tools/coverage-data/coverage-history.tsv, and may already carry the
      # workflow's own auto-exclusion commit to
      # tools/coverage-data/coverage-exclusions.txt from the step above.
      # Neither data file lives under tools/ci/, so validate-agent-commit.sh
      # classifies both as ordinary (non-CI) files and RULE 3 never applies
      # to them — no allowlist or bypass is needed. New tests satisfy RULE 2.
      - name: Submit coverage agent job
        if: steps.decide.outputs.run == 'true' && steps.select.outputs.target != ''
        env:
          CONTROLLER_HOST: ${{ secrets.FLOWTREE_CONTROLLER_HOST || 'mac-studio' }}
          CONTROLLER_PORT: ${{ secrets.FLOWTREE_CONTROLLER_PORT || '7780' }}
          BRANCH: ${{ steps.branch.outputs.branch }}
          BASE_BRANCH: master
          DESCRIPTION: "Raise test coverage of ${{ steps.select.outputs.target }}"
          PROTECT_TEST_FILES: "true"
          AUTO_CREATE_PR: "true"
          ENFORCE_CHANGES: "true"
        run: |
          ./tools/ci/submit-agent-job.sh "${{ runner.temp }}/agent-prompt.txt"

      - name: Summary
        if: always()
        run: |
          echo "## Quality Assurance — Test Coverage" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Decision:** \`${{ steps.decide.outputs.run }}\` (${{ steps.decide.outputs.reason }})" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.decide.outputs.run }}" = "true" ]; then
            if [ -n "${{ steps.select.outputs.target }}" ]; then
              echo "**Target:** \`${{ steps.select.outputs.target }}\` (${{ steps.select.outputs.language }}) @ ${{ steps.select.outputs.current }}% → ${{ env.COVERAGE_THRESHOLD }}%" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "Created \`${{ steps.branch.outputs.branch }}\` and submitted a coverage-qa job." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "No eligible coverage target — everything is excluded, on cooldown, or already at threshold." >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            case "${{ steps.decide.outputs.reason }}" in
              pr-open) echo "Skipped: a previous coverage-qa PR is still open. Review or close it first." >> "$GITHUB_STEP_SUMMARY" ;;
              too-recent) echo "Skipped: the last coverage round is younger than the minimum interval." >> "$GITHUB_STEP_SUMMARY" ;;
              pr-query-failed) echo "Skipped: could not reach the GitHub API to check for an open PR." >> "$GITHUB_STEP_SUMMARY" ;;
              pr-page-limit) echo "Skipped: too many open PRs to page through; assumed a previous round is still open." >> "$GITHUB_STEP_SUMMARY" ;;
              *) echo "Skipped: ${{ steps.decide.outputs.reason }}" >> "$GITHUB_STEP_SUMMARY" ;;
            esac
          fi
