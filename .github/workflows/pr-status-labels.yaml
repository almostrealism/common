name: "PR Status Labels"

# This repository's caller of the reusable PR Status Labels workflow
# (pr-status-labels-run.yaml). Gives every open pull request one `ci: ...`
# label for the stage it is in, so the pull request list shows what is ready
# for a person, what an agent or the test fleet is still working on, and what
# has stopped:
#
#   ci: validating        the validate run (build and static checks) is running
#   ci: auto-review       an agent is reviewing the branch; the full test run
#                         starts when it has nothing left to change
#   ci: full tests        the full test run, with its flaky-test retries
#   ci: auto-fix          the full test run failed and an agent is fixing it
#   ci: ready for review  both runs passed on the head commit
#   ci: ready to launch   a settled draft plan an approver could launch now
#                         (replaces ci: ready for review; sits beside the
#                         other settled stages)
#   ci: needs attention   CI stopped with no agent working on it
#   ci: review limit      the controller refused another auto-review or
#                         auto-fix pass: the per-PR pass limit is reached
#   ci: stalled           added beside the others when a stage has lasted
#                         longer than it should
#
# tools/ci/pr-status-labels.py works the state out from the GitHub API each
# time, never from the labels already present or from the event that started
# this run, so a late or missed event is corrected by the next run. The events
# below only make the labels prompt: a Build and Test run starting or finishing
# updates its branch's pull request, and an Auto-Resolve Submit run finishing
# (a retry or an agent sent) and the schedule update every open pull request.
# The schedule is also what notices a stage that has stalled.
#
# The work is done by the reusable workflow, the same one another repository
# calls for its own CI pipeline (see its header for the adoption example).
# Every input below names this repository's own FlowTree pipeline explicitly,
# so behaviour here is identical to before the extraction; the reusable
# workflow's own defaults assume none of it, for a repository with no
# equivalent. It runs from the default branch and executes no pull request
# code: it checks out the default branch's tools/ci and only reads the API and
# writes labels.

on:
  workflow_run:
    workflows: ["Build and Test", "Auto-Resolve Submit"]
    types: [requested, completed]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: >-
    pr-status-labels-${{ github.event_name == 'workflow_run' &&
    github.event.workflow_run.name == 'Build and Test' &&
    github.event.workflow_run.head_branch || 'all' }}
  cancel-in-progress: false

jobs:
  label:
    # A master run belongs to no pull request, and an Auto-Resolve Submit run
    # has decided nothing until it completes.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.name == 'Build and Test' &&
       github.event.workflow_run.head_branch != 'master') ||
      (github.event.workflow_run.name == 'Auto-Resolve Submit' &&
       github.event.action == 'completed')
    uses: ./.github/workflows/pr-status-labels-run.yaml
    permissions:
      actions: read
      checks: read
      contents: read
      issues: write
      # The remediation-cap commit status (ci: review limit).
      statuses: read
      pull-requests: write
    with:
      framework-ref: ${{ github.event.repository.default_branch }}
      branch: >-
        ${{ github.event_name == 'workflow_run' &&
        github.event.workflow_run.name == 'Build and Test' &&
        github.event.workflow_run.head_branch || '' }}
      workflow-file: analysis.yaml
      all-checks: "All Checks"
      test-checks: "Test Checks"
      validate-submitters: "auto-review-submit,auto-resolve-python-submit"
      test-submitters: "auto-resolve-python-submit"
      staged-request: "auto-resolve-request"
      cap-status: "remediation-cap"
      expect-test-run: true
      plans-dir: "docs/plans"
      plan-exclude-pattern: "MANAGER_LOG.md"
