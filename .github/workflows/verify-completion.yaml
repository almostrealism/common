name: "Verify Completion"

# The manual "implement the plan" trigger. Dispatched by hand on a branch
# (or through the project_verify_branch MCP tool) once a person has read the
# branch's plan and approved it; it submits a coding agent that implements
# every goal the plan sets and proves each one with tests.
#
# Nothing starts implementation automatically. On a docs-only branch, which is
# what a plan branch is until this runs, auto-review in analysis.yaml sends a
# review that improves the documents and never carries out the plan.
#
# The work is done by the reusable Implement Plan workflow, the same one other
# repositories call for their own plan branches, so this repository exercises
# exactly the code they run. It registers the branch's workstream, applies the
# workstream settings the plan declares for itself, and submits the agent,
# running only the default branch's scripts and prompt templates: nothing from
# the dispatched branch runs while the controller token is in reach. See its
# header for how the jobs are split around the token.
#
# Manual dispatch is not a code-integrity boundary, and workflow_dispatch runs
# this file from the dispatched ref, so a branch that edits it controls what
# runs with the secret. That exposure is the one analysis.yaml already has for
# pull_request runs and rests on the same mitigations; see "No job that runs
# pull request code holds controller credentials" in .github/CLAUDE.md.

on:
  workflow_dispatch:
    inputs:
      plan_file:
        description: "Path to the plan file (auto-detected if omitted)"
        required: false
        type: string

# Only one verify-completion run at a time per branch.
concurrency:
  group: verify-completion-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  implement:
    uses: ./.github/workflows/implement-plan.yaml
    permissions:
      contents: read
    with:
      plan-file: ${{ inputs.plan_file }}
      controller-url: ${{ vars.FLOWTREE_CONTROLLER_URL }}
      cf-access-client-id: ${{ vars.FLOWTREE_CF_ACCESS_CLIENT_ID }}
    secrets:
      FLOWTREE_CF_ACCESS_CLIENT_SECRET: ${{ secrets.FLOWTREE_CF_ACCESS_CLIENT_SECRET }}
