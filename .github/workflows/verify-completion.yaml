name: "Verify Completion"

# The manual "implement the plan" trigger. Dispatched by hand on a branch
# (or through the project_verify_branch MCP tool) once a person has read the
# branch's plan and approved it; it submits a coding agent that implements
# every goal the plan sets and proves each one with tests.
#
# Nothing starts implementation automatically. On a docs-only branch, which is
# what a plan branch is until this runs, auto-review in analysis.yaml sends a
# review that improves the documents and never carries out the plan.
#
# Every run registers (or updates) the branch's FlowTree workstream, and applies
# the workstream settings the plan declares for itself: a
# docs/plans/<prefix>-workstream.yaml file whose prefix matches the branch name
# without "project/" (see tools/ci/plan_workstream_config.py). Applying them
# here, when a person dispatches the implementation, means approving the plan
# also approves the environment it asks for — Metal, for instance.
#
# Like the Master Agent Dispatch jobs, every job runs on a GitHub-hosted
# runner and reaches the controller through its Cloudflare Access tunnel;
# none of them builds or tests anything.
#
# Manual dispatch is not a code-integrity boundary: a branch author who edited
# a script this workflow runs could exfiltrate the controller service token
# when it is dispatched on their branch. So no job that holds the token runs any
# of the branch's code. register-workstream needs nothing from the branch and
# runs register-workstream.sh from a default-branch checkout. The prompt does
# come from the branch's own templates, so it is built in a separate job
# (build-prompt) that never sees the token and stages the result as an artifact;
# the token-bearing submit job (verify) checks out the default branch, downloads
# that artifact, and submits it with submit-staged-request.sh. Building the
# prompt in its own job — rather than re-checking-out the default branch inside
# the submit job — is deliberate: a re-checkout replaces the workspace files but
# not $GITHUB_ENV/$GITHUB_PATH, so a prompt builder that appended BASH_ENV, PATH
# or LD_PRELOAD to them would still steer the trusted submit step. A separate job
# has never run the branch's code, so its environment is clean. This is the same
# stage-then-submit pattern the auto-review/auto-resolve jobs in analysis.yaml
# use.
#
# This guards the token against the branch's scripts, not against the branch's
# copy of this file: workflow_dispatch runs the workflow definition from the
# dispatched ref, so a branch that edits this YAML controls every job in the
# run. Pinning the submission to a default-branch reusable workflow would not
# change that, since the caller YAML still decides what runs with the secret.
# The exposure is the one analysis.yaml already has for pull_request runs and
# rests on the same mitigations; see "No job that runs pull request code holds
# controller credentials" in .github/CLAUDE.md.

on:
  workflow_dispatch:
    inputs:
      plan_file:
        description: "Path to the plan file (auto-detected if omitted)"
        required: false
        type: string

# Only one verify-completion run at a time per branch.
concurrency:
  group: verify-completion-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # ── Phase 1: Detect the plan file ─────────────────────────────────
  detect-plan:
    if: github.ref != 'refs/heads/master'
    runs-on: ubuntu-latest

    outputs:
      plan_file: ${{ steps.detect.outputs.plan_file }}
      is_new_plan: ${{ steps.detect.outputs.is_new_plan }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      # plan_file is free text from a dispatch input, so it is read through the
      # environment rather than interpolated into the script.
      - name: Detect plan file
        id: detect
        env:
          PLAN_FILE_INPUT: ${{ github.event.inputs.plan_file }}
        run: |
          # Use explicit input if provided
          if [ -n "$PLAN_FILE_INPUT" ]; then
            PLAN="$PLAN_FILE_INPUT"
            if [ ! -f "$PLAN" ]; then
              echo "::error::Plan file not found: $PLAN"
              exit 1
            fi
            echo "plan_file=$PLAN" >> "$GITHUB_OUTPUT"

            # Check if this file is new relative to master
            if git diff --name-only --diff-filter=A origin/master...HEAD -- "$PLAN" | grep -q .; then
              echo "is_new_plan=true" >> "$GITHUB_OUTPUT"
            else
              echo "is_new_plan=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          # Auto-detect: find new .md files in docs/plans/ relative to master
          NEW_PLANS=$(git diff --name-only --diff-filter=A origin/master...HEAD -- 'docs/plans/*.md' \
            | grep -v 'MANAGER_LOG.md' || true)

          COUNT=$(echo "$NEW_PLANS" | grep -c '.' || true)

          if [ "$COUNT" -eq 0 ]; then
            echo "::error::No new plan document found in docs/plans/ and no plan_file input provided"
            exit 1
          elif [ "$COUNT" -gt 1 ]; then
            echo "::warning::Multiple new plan documents found; using the first one"
          fi

          PLAN=$(echo "$NEW_PLANS" | head -1)
          echo "plan_file=$PLAN" >> "$GITHUB_OUTPUT"
          echo "is_new_plan=true" >> "$GITHUB_OUTPUT"
          echo "::notice::Detected plan file: $PLAN"

  # ── Phase 2a: Resolve the plan's workstream settings (token-free) ──
  # Reading the settings means installing PyYAML from the network, and code a
  # package runs on install or import can rewrite the checked-out scripts or
  # append to $GITHUB_ENV/$GITHUB_PATH, both of which persist into later steps
  # of the same job. So the settings are resolved here, in a job that never
  # holds the controller token, and only the validated JSON crosses into
  # register-workstream, as job outputs read through `env:`.
  resolve-plan-settings:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      settings_file: ${{ steps.plan_settings.outputs.settings_file }}
      required_labels: ${{ steps.plan_settings.outputs.required_labels }}

    steps:
      # The resolver is the default branch's copy, never the dispatched
      # branch's, so a branch cannot change how its own settings are validated.
      - name: Checkout trusted scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The branch's docs/plans files are fetched as data — `git archive`, not a
      # checkout — and read by the default branch's resolver, so nothing the
      # branch controls runs in this job. They are read from the dispatched
      # commit, the one every other job in this run uses, so a push made after
      # the plan was approved cannot change the settings the implementation
      # runs with; the branch name is used only to match the settings file.
      # An invalid settings file, or a commit that cannot be read, fails the
      # job, which stops the implementation from being submitted on a machine
      # the plan did not ask for.
      - name: Resolve the plan's workstream settings
        id: plan_settings
        env:
          BRANCH: ${{ github.ref_name }}
          DISPATCHED_SHA: ${{ github.sha }}
        run: |
          set -eo pipefail
          if [ ! -f ./tools/ci/plan_workstream_config.py ]; then
            echo "::warning::The default branch has no tools/ci/plan_workstream_config.py yet — no plan settings are applied"
            exit 0
          fi
          python3 -m pip install --quiet pyyaml
          mkdir -p branch-plans
          if ! git fetch --quiet --no-tags --depth 1 origin "$DISPATCHED_SHA"; then
            echo "::error::Could not fetch the dispatched commit ${DISPATCHED_SHA} — the plan's settings cannot be read"
            exit 1
          fi
          if git cat-file -e FETCH_HEAD:docs/plans 2>/dev/null; then
            git archive FETCH_HEAD docs/plans | tar -x -C branch-plans
            SETTINGS=$(python3 ./tools/ci/plan_workstream_config.py "$BRANCH" branch-plans/docs/plans) \
              || { echo "$SETTINGS"; exit 1; }
          else
            echo "The dispatched commit has no docs/plans — no plan settings are applied"
            SETTINGS='{}'
          fi
          echo "Plan workstream settings: $SETTINGS"
          echo "settings_file=$(echo "$SETTINGS" | jq -r '.file // empty')" >> "$GITHUB_OUTPUT"
          echo "required_labels=$(echo "$SETTINGS" | jq -c '.requiredLabels // empty')" >> "$GITHUB_OUTPUT"

  # ── Phase 2b: Register workstream and apply the plan's settings ────
  # Runs on every dispatch: registration is idempotent, and an existing
  # workstream is updated with the plan document and the plan's settings.
  register-workstream:
    needs: [detect-plan, resolve-plan-settings]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # This workflow is dispatched by hand on a branch, so its checkout would
      # otherwise be the branch's own tree — including its copy of
      # register-workstream.sh, which runs below with the Cloudflare Access
      # service token in its environment. Manual dispatch is not a code-integrity
      # boundary: a branch author who edited that script could exfiltrate the
      # token. Check out the trusted default-branch copy instead, the same way
      # the auto-review/auto-resolve submit jobs in analysis.yaml do, so the
      # secret only ever runs against reviewed code. This job needs nothing from
      # the branch — register-workstream.sh takes its target from the environment
      # (BRANCH/BASE_BRANCH/PLAN_FILE), not from the working tree.
      - name: Checkout trusted scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Register workstream
        env:
          CONTROLLER_URL: ${{ vars.FLOWTREE_CONTROLLER_URL || 'https://flowtree.almostrealism.ai' }}
          CF_ACCESS_CLIENT_ID: ${{ vars.FLOWTREE_CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.FLOWTREE_CF_ACCESS_CLIENT_SECRET }}
          BRANCH: ${{ github.ref_name }}
          BASE_BRANCH: master
          PLAN_FILE: ${{ needs.detect-plan.outputs.plan_file }}
          REPO_URL: git@github.com:${{ github.repository }}.git
          REQUIRED_LABELS_JSON: ${{ needs.resolve-plan-settings.outputs.required_labels }}
        run: |
          # The script is read from the default branch, which lacks it until the
          # change that added it has merged; register nothing rather than fail.
          if [ ! -f ./tools/ci/register-workstream.sh ]; then
            echo "::warning::The default branch has no tools/ci/register-workstream.sh yet — the workstream is not registered here; the submission below creates it on demand"
            exit 0
          fi
          chmod +x ./tools/ci/register-workstream.sh
          ./tools/ci/register-workstream.sh

      # plan_file derives from the dispatch input, so it and the ref name reach
      # the summary through the environment rather than interpolated into the
      # script, where either could execute.
      - name: Summary
        if: always()
        env:
          BRANCH: ${{ github.ref_name }}
          PLAN_FILE: ${{ needs.detect-plan.outputs.plan_file }}
          SETTINGS_FILE: ${{ needs.resolve-plan-settings.outputs.settings_file }}
          REQUIRED_LABELS: ${{ needs.resolve-plan-settings.outputs.required_labels }}
          JOB_STATUS: ${{ job.status }}
        run: |
          echo "## Register Workstream" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          # This step runs even when an earlier one failed; only a successful
          # job registered the workstream and applied the plan's settings.
          if [ "$JOB_STATUS" != "success" ]; then
            echo "Registration of the FlowTree workstream for branch \`$BRANCH\` **failed** ($JOB_STATUS)," >> "$GITHUB_STEP_SUMMARY"
            echo "so the implementation was not submitted. See the failed step's log." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "Registered a FlowTree workstream for branch \`$BRANCH\`" >> "$GITHUB_STEP_SUMMARY"
          echo "with planning document \`$PLAN_FILE\`." >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$SETTINGS_FILE" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Applied \`$SETTINGS_FILE\`: required labels \`$REQUIRED_LABELS\`." >> "$GITHUB_STEP_SUMMARY"
          fi

  # ── Phase 3: Build the implementation prompt ──────────────────────
  # The prompt is built from the branch's own templates, so it runs the branch's
  # code — but this job never holds the controller token, so that code cannot
  # reach it. The prompt is staged as an artifact for the trusted submit job
  # below, the same way auto-review stages its request in analysis.yaml.
  build-prompt:
    needs: [detect-plan, resolve-plan-settings, register-workstream]
    # Run after detect-plan succeeds, and only if registration succeeded (or was
    # skipped) — not if it failed, and not if the run was cancelled.
    # `!cancelled()` (not `always()`) so a cancelled run stops here instead of
    # building and submitting the implementation anyway; register-workstream is
    # allowed only when it succeeded or was skipped, so its `cancelled` result
    # blocks this job rather than passing a `!= 'failure'` test.
    # resolve-plan-settings must itself have succeeded: when it fails (an
    # invalid plan settings file, an unreadable dispatched commit) the
    # register-workstream job that needs it is *skipped*, not failed, and the
    # skipped-registration allowance above would otherwise submit the
    # implementation without the labels the plan declared.
    if: |
      !cancelled()
      && needs.detect-plan.result == 'success'
      && needs.resolve-plan-settings.result == 'success'
      && (needs.register-workstream.result == 'success'
          || needs.register-workstream.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Build prompt
        env:
          BRANCH: ${{ github.ref_name }}
          BASE_BRANCH: master
          COMMIT_SHA: ${{ github.sha }}
        run: |
          chmod +x ./tools/ci/prompts/build-verify-prompt.sh
          ./tools/ci/prompts/build-verify-prompt.sh "${{ runner.temp }}/agent-prompt.txt"

      - name: Stage submit request
        env:
          BRANCH: ${{ github.ref_name }}
          BASE_BRANCH: master
          DESCRIPTION: "Implement the plan"
          PROTECT_TEST_FILES: "false"
        run: |
          ./tools/ci/stage-submit-request.sh "${{ runner.temp }}/agent-prompt.txt" verify-request

      - name: Upload staged request
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: verify-request
          path: verify-request/
          retention-days: 1

  # ── Phase 4: Submit the implementation job (trusted) ──────────────
  # Holds the controller token, so it runs only default-branch code. No branch
  # code has run in this job, so nothing the branch controls has touched
  # $GITHUB_ENV/$GITHUB_PATH before the token is attached. The prompt comes in as
  # the staged artifact, and submit-staged-request.sh reads it through a key
  # allowlist that ignores BASH_ENV/PATH/LD_PRELOAD and the like.
  verify:
    needs: [detect-plan, build-prompt]
    # `!cancelled()` (not `always()`) so cancelling the run after build-prompt
    # has staged its artifact stops the submission instead of letting the
    # token-bearing job run anyway. build-prompt must have succeeded.
    if: |
      !cancelled()
      && needs.build-prompt.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout trusted scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Download staged request
        uses: actions/download-artifact@v4
        with:
          name: verify-request
          path: staged-request

      - name: Submit agent job
        env:
          CONTROLLER_URL: ${{ vars.FLOWTREE_CONTROLLER_URL || 'https://flowtree.almostrealism.ai' }}
          CF_ACCESS_CLIENT_ID: ${{ vars.FLOWTREE_CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.FLOWTREE_CF_ACCESS_CLIENT_SECRET }}
          # The target comes from this run's event, never from the staged
          # request, which the branch's code wrote.
          BRANCH: ${{ github.ref_name }}
          BASE_BRANCH: master
          PROTECT_TEST_FILES: "false"
        run: |
          # The script is read from the default branch, which lacks it until the
          # change that added it has merged; submit nothing rather than fail.
          if [ ! -f ./tools/ci/submit-staged-request.sh ]; then
            echo "::warning::The default branch has no tools/ci/submit-staged-request.sh yet — the implementation job is not submitted"
            exit 0
          fi
          bash ./tools/ci/submit-staged-request.sh staged-request

      # plan_file derives from the dispatch input, so it and the ref name reach
      # the summary through the environment rather than interpolated into the
      # script, where either could execute.
      - name: Summary
        if: always()
        env:
          BRANCH: ${{ github.ref_name }}
          PLAN_FILE: ${{ needs.detect-plan.outputs.plan_file }}
        run: |
          echo "## Verify Completion" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "A FlowTree coding agent job was submitted to implement and verify the goals" >> "$GITHUB_STEP_SUMMARY"
          echo "on branch \`$BRANCH\` as described in" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$PLAN_FILE\`." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The agent will:" >> "$GITHUB_STEP_SUMMARY"
          echo "1. Implement any unfinished goals from the plan" >> "$GITHUB_STEP_SUMMARY"
          echo "2. Verify every goal is fully implemented" >> "$GITHUB_STEP_SUMMARY"
          echo "3. Ensure each goal is proven correct by meaningful tests" >> "$GITHUB_STEP_SUMMARY"
          echo "4. Check that no existing tests were weakened or disabled" >> "$GITHUB_STEP_SUMMARY"
